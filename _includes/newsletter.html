<div class="newsletter-signup">
  <h3 class="newsletter-title">{{ site.newsletter_title | default: "Stay updated" }}</h3>
  <p class="newsletter-description">
    {{ site.newsletter_description | default: "Subscribe to get new posts delivered to your inbox. No spam, unsubscribe anytime." }}
  </p>
  
  {% if site.newsletter_form_action %}
  <!-- Custom newsletter form (e.g., Buttondown, ConvertKit, Mailchimp) -->
  <form class="newsletter-form" action="{{ site.newsletter_form_action }}" method="post" target="_blank">
    <input 
      type="email" 
      name="email" 
      class="newsletter-input" 
      placeholder="your@email.com" 
      required
      aria-label="Email address"
    >
    <button type="submit" class="btn btn-primary">Subscribe</button>
  </form>
  {% else %}
  <!-- Mailto fallback - opens email client with pre-filled subject -->
  <a href="mailto:{{ site.email }}?subject=Subscribe%20to%20{{ site.title | url_encode }}&body=Hi%20Mandar%2C%0A%0AI'd%20like%20to%20subscribe%20to%20your%20newsletter.%0A%0AThanks!" class="btn btn-primary newsletter-mailto-btn">
    Subscribe via Email
  </a>
  {% endif %}
</div>
