# =============================================================================
# PROJECTS DATA
# =============================================================================
# Add your projects here. Each project will appear on the /projects/ page.
# The URL field should point to mandar.dev/projects/xyz (your reverse proxy
# will route to the actual running project).
#
# Fields:
#   - name: Project title (required)
#   - description: Brief description (required)
#   - url: Link to the project (required)
#   - tags: Array of technology tags (optional)
#   - icon: SVG icon markup (optional)
#   - external: true if link opens in new tab (optional)
# =============================================================================

- name: "Susie's Quest"
  description: "A retro-style platform jumping game. Help Susie collect yarn and candy while avoiding enemies! Features power-ups, multiple platform types, and 8-bit sound effects."
  url: "/projects/susies-quest"
  tags:
    - Game
    - HTML5 Canvas
    - Mobile
  icon: '<img src="/projects/susies-quest/susie.png" alt="Susie" style="width:100%;height:100%;object-fit:contain;image-rendering:pixelated;">'

- name: "Markets Heatmap"
  description: "A visual heatmap displaying real-time market data and trends across different sectors and asset classes."
  url: "/projects/markets-heatmap"
  tags:
    - Finance
    - Data Visualization
