# =============================================================================
# PROJECTS DATA
# =============================================================================
# Add your projects here. Each project will appear on the /projects/ page.
# The URL field should point to mandar.dev/projects/xyz (your reverse proxy
# will route to the actual running project).
#
# Fields:
#   - name: Project title (required)
#   - description: Brief description (required)
#   - url: Link to the project (required)
#   - tags: Array of technology tags (optional)
#   - icon: SVG icon markup (optional)
#   - external: true if link opens in new tab (optional)
# =============================================================================

- name: "Susie's Quest"
  description: "A retro-style platform jumping game. Help Susie collect yarn and candy while avoiding enemies! Features power-ups, multiple platform types, and 8-bit sound effects."
  url: "/projects/susies-quest"
  tags:
    - Game
    - HTML5 Canvas
    - Mobile
  icon: '<img src="/projects/susies-quest/susie.png" alt="Susie" style="width:100%;height:100%;object-fit:contain;image-rendering:pixelated;">'

- name: "Market Heatmap"
  description: "A Finviz-style interactive treemap showing real-time stock market data for S&P 500, Nasdaq 100, and Dow Jones 30. Features pre-market data, sector grouping, WSB trending tickers, and auto-refresh."
  url: "https://projects.mandar.dev/market-heatmap/"
  external: true
  tags:
    - Finance
    - React
    - Data Visualization
  icon: '<img src="/projects/market-heatmap/logo.png" alt="Market Heatmap" style="width:100%;height:100%;object-fit:contain;image-rendering:pixelated;">'

- name: "Options Rebel"
  description: "An automated bot that scans the options market for unusual activity and surfaces interesting trades in real time. Delivers daily picks featuring strike prices, expirations, and volume data across Twitter, Discord, and Telegram."
  url: "https://x.com/optionsrebel"
  external: true
  tags:
    - Finance
    - Automation
    - Bot
  icon: '<img src="/projects/options-rebel/logo.png" alt="Options Rebel" style="width:100%;height:100%;object-fit:contain;image-rendering:pixelated;">'

- name: "Android RSS Readers"
  description: "A framework for building offline-first Android news readers. Designed for commuters with spotty connectivity, the apps sync RSS feeds in the background and cache articles locally. Shipped as India News and New York News on Google Play."
  url: "https://play.google.com/store/apps/developer?id=Mandar+Limaye"
  external: true
  tags:
    - Android
    - RSS
    - Offline
  icon: '<img src="/projects/rss-readers/logo.png" alt="RSS Readers" style="height:100%;width:auto;object-fit:contain;">'
